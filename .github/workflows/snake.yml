# Draws the contribution snake for the profile README, light and dark, every day.
# The images go to the `output` branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Beijing time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#ff8fab
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8fab

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

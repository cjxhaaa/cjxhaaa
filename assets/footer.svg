<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
<style>
@font-face{font-family:'Kuaile';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fredoka';src:url(data:font/woff2;base64,) format('woff2')}
.cn{font-family:'Kuaile','Microsoft YaHei','PingFang SC',sans-serif}
.en{font-family:'Fredoka','Segoe UI',sans-serif;font-weight:600}
.ink{stroke:#2d2a45;stroke-linejoin:round;stroke-linecap:round}
.bounce{transform-box:fill-box;transform-origin:50% 100%;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.08,.92)}30%{transform:translateY(-16px) scale(.94,1.06)}55%{transform:translateY(-20px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.1,.9)}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 1.6s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scaleX(1.05)}45%{transform:scaleX(.7);opacity:.5}}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.55) rotate(45deg);opacity:.6}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.zz{animation:zz 3s ease-out infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-34px)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.04,.96)}50%{transform:scale(.98,1.03)}}
</style>
<defs><clipPath id="f"><rect x="4" y="4" width="892" height="182" rx="30"/></clipPath></defs>
<rect x="4" y="4" width="892" height="182" rx="30" fill="#fff4e3"/>
<g clip-path="url(#f)">
<path class="ink" d="M-10 150 Q220 104 450 140 T910 128 L910 200 L-10 200 Z" fill="#c8f5d8" stroke-width="4"/>
<g class="ink" stroke-width="2"><circle cx="150" cy="138" r="6" fill="#ffd166"/><circle cx="182" cy="132" r="5" fill="#ff8fab"/><circle cx="700" cy="130" r="6" fill="#ff8fab"/><circle cx="736" cy="136" r="5" fill="#ffd166"/></g>
</g>
<rect x="4" y="4" width="892" height="182" rx="30" fill="none" class="ink" stroke-width="4"/>
<g transform="translate(250 34) scale(0.74)">
<ellipse class="shadow" cx="80" cy="131" rx="58" ry="7" fill="#2d2a45" opacity=".16"/>
<g class="breathe">
<path class="ink" d="M18 128 C6 128 4 108 10 92 C20 52 48 18 80 18 C112 18 140 52 150 92 C156 108 154 128 142 128 Z" fill="#a8d8ff" stroke-width="4"/>
<ellipse cx="50" cy="48" rx="15" ry="8" fill="#fff" opacity=".75" transform="rotate(-32 50 48)"/>
<circle cx="37" cy="64" r="4" fill="#fff" opacity=".75"/>
<path class="ink" d="M52 80 Q60 86 68 80 M92 80 Q100 86 108 80" fill="none" stroke-width="3.5"/>
<ellipse cx="42" cy="95" rx="10" ry="5" fill="#ff8fab" opacity=".55"/><ellipse cx="118" cy="95" rx="10" ry="5" fill="#ff8fab" opacity=".55"/>
<path class="ink" d="M76 97 Q80 99 84 97" fill="none" stroke-width="3"/>
</g></g>
<text class="en zz" x="372" y="52" font-size="22" fill="#6e6a8c">Z</text>
<text class="en zz" x="386" y="42" font-size="16" fill="#6e6a8c" style="animation-delay:1s">z</text>
<text class="en zz" x="396" y="34" font-size="13" fill="#6e6a8c" style="animation-delay:2s">z</text>
<text class="cn" x="450" y="92" font-size="30" fill="#4a4668">谢谢你来玩～下次见！</text>
<g transform="translate(430 52) scale(0.8)"><path class="ink twinkle" style="animation-delay:0.3s"
d="M0 -13 Q2.5 -2.5 13 0 Q2.5 2.5 0 13 Q-2.5 2.5 -13 0 Q-2.5 -2.5 0 -13 Z" fill="#ffd166" stroke-width="2.5"/></g><g transform="translate(780 64) scale(1)"><path class="ink twinkle" style="animation-delay:1.1s"
d="M0 -13 Q2.5 -2.5 13 0 Q2.5 2.5 0 13 Q-2.5 2.5 -13 0 Q-2.5 -2.5 0 -13 Z" fill="#ff8fab" stroke-width="2.5"/></g>
</svg>
